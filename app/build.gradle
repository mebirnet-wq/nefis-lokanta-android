plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nefislokanta.mobil'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nefislokanta.mobil'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1.0'
    }

    // JDK 17 bytecode keeps the build consistent across Java and Kotlin tasks.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
